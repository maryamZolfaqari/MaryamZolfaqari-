<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>🌟 محاسبه محیط مثلث با Latitude/Longitude 🌟</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Vazirmatn', sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(270deg, #ff9a9e, #fad0c4, #a18cd1, #fbc2eb);
        background-size: 800% 800%;
        animation: gradientBG 20s ease infinite;
    }

    @keyframes gradientBG {
        0% {background-position:0% 50%;}
        50% {background-position:100% 50%;}
        100% {background-position:0% 50%;}
    }

    .card {
        background: rgba(255, 255, 255, 0.25);
        backdrop-filter: blur(15px);
        border-radius: 25px;
        padding: 50px 40px;
        width: 450px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .card:hover {
        transform: translateY(-10px);
        box-shadow: 0 25px 60px rgba(0,0,0,0.3);
    }

    h2 {
        text-align: center;
        margin-bottom: 30px;
        color: #fff;
        text-shadow: 0 3px 8px rgba(0,0,0,0.3);
        font-size: 28px;
    }

    label {
        display: block;
        margin-bottom: 5px;
        font-weight: 700;
        color: #fff;
        text-shadow: 0 1px 3px rgba(0,0,0,0.4);
    }

    input[type="number"] {
        width: 100%;
        padding: 14px;
        margin-bottom: 20px;
        border-radius: 12px;
        border: none;
        outline: none;
        background: rgba(255,255,255,0.8);
        font-size: 16px;
        transition: all 0.3s ease;
    }
    input:focus {
        box-shadow: 0 0 20px rgba(255,182,193,0.7);
        background: rgba(255,255,255,0.95);
    }

    button {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #ff758c, #ff7eb3);
        border: none;
        color: white;
        font-weight: bold;
        font-size: 18px;
        border-radius: 20px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 10px 25px rgba(255,182,193,0.5);
    }
    button:hover {
        transform: scale(1.05);
        box-shadow: 0 15px 30px rgba(255,182,193,0.6);
    }

    .result {
        margin-top: 20px;
        font-weight: bold;
        text-align: center;
        color: #fff;
        font-size: 20px;
        text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

</style>
</head>
<body>

<div class="card">
    <h2>🌐 محاسبه محیط مثلث با Lat/Lon</h2>
    <form id="triangleForm">
        <label>نقطه 1 - Latitude:</label>
        <input type="number" id="lat1" step="0.0001" value="35.6892" required>
        <label>نقطه 1 - Longitude:</label>
        <input type="number" id="lon1" step="0.0001" value="51.3890" required>

        <label>نقطه 2 - Latitude:</label>
        <input type="number" id="lat2" step="0.0001" value="34.0522" required>
        <label>نقطه 2 - Longitude:</label>
        <input type="number" id="lon2" step="0.0001" value="-118.2437" required>

        <label>نقطه 3 - Latitude:</label>
        <input type="number" id="lat3" step="0.0001" value="51.5074" required>
        <label>نقطه 3 - Longitude:</label>
        <input type="number" id="lon3" step="0.0001" value="-0.1278" required>

        <button type="submit">✨ محاسبه محیط ✨</button>
        <div id="triangleResult" class="result">محیط مثلث نمایش داده می‌شود...</div>
    </form>
</div>

<script>
document.getElementById('triangleForm').addEventListener('submit', async function(e){
    e.preventDefault();

    const lat1 = parseFloat(document.getElementById('lat1').value);
    const lon1 = parseFloat(document.getElementById('lon1').value);
    const lat2 = parseFloat(document.getElementById('lat2').value);
    const lon2 = parseFloat(document.getElementById('lon2').value);
    const lat3 = parseFloat(document.getElementById('lat3').value);
    const lon3 = parseFloat(document.getElementById('lon3').value);

    try {
        const response = await fetch('http://localhost:5000', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ a: lat1, b: lat2, c: lat3 }) // فرضاً WebAPI شما اینا رو می‌گیره
        });

        const data = await response.json();
        document.getElementById('triangleResult').innerText = `محیط مثلث: ${data.perimeter.toFixed(4)} متر`;
    } catch (err) {
        console.error(err);
        document.getElementById('triangleResult').innerText = "❌ خطا در فراخوانی سرویس.";
    }
});
</script>

</body>
</html>
