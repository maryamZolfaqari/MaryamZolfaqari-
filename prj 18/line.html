<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>محاسبه طول خط حرفه‌ای</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');

    body {
        font-family: 'Roboto', sans-serif;
        direction: rtl;
        margin: 0;
        padding: 0;
        height: 100vh;
        background: linear-gradient(135deg, #6a11cb, #2575fc);
        display: flex;
        justify-content: center;
        align-items: center;
        color: #fff;
    }

    .container {
        background: rgba(255,255,255,0.05);
        padding: 30px 40px;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        backdrop-filter: blur(10px);
        text-align: center;
        width: 350px;
        animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
    }

    h2 {
        margin-bottom: 25px;
        text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    input {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border-radius: 10px;
        border: none;
        outline: none;
        font-size: 16px;
        background: rgba(255,255,255,0.2);
        color: #fff;
        box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
        transition: 0.3s;
    }

    input:focus {
        background: rgba(255,255,255,0.3);
        box-shadow: 0 0 10px #fff;
    }

    button {
        width: 100%;
        padding: 12px;
        margin-top: 15px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #ff6a00, #ee0979);
        color: #fff;
        font-size: 16px;
        cursor: pointer;
        transition: 0.4s;
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    button:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.4);
    }

    #result {
        margin-top: 20px;
        font-size: 18px;
        font-weight: bold;
        padding: 10px;
        border-radius: 10px;
        background: rgba(0,0,0,0.2);
        text-shadow: 0 1px 5px rgba(0,0,0,0.5);
    }
</style>
</head>
<body>

<div class="container">
    <h2>محاسبه طول خط</h2>
    <input type="number" id="x1" placeholder="x نقطه ابتدا" step="any">
    <input type="number" id="y1" placeholder="y نقطه ابتدا" step="any">
    <input type="number" id="x2" placeholder="x نقطه انتها" step="any">
    <input type="number" id="y2" placeholder="y نقطه انتها" step="any">
    <button onclick="calculate()">محاسبه فاصله</button>
    <div id="result"></div>
</div>

<script>
class Line {
    constructor(x1, y1, x2, y2) {
        this.x1 = x1;
        this.y1 = y1;
        this.x2 = x2;
        this.y2 = y2;
    }

    length() {
        return Math.sqrt(
            Math.pow(this.x2 - this.x1, 2) +
            Math.pow(this.y2 - this.y1, 2)
        );
    }
}

function calculate() {
    let x1 = document.getElementById("x1").value;
    let y1 = document.getElementById("y1").value;
    let x2 = document.getElementById("x2").value;
    let y2 = document.getElementById("y2").value;

    if (x1 === "" || y1 === "" || x2 === "" || y2 === "") {
        document.getElementById("result").innerText =
            "خطا: لطفاً تمام مقادیر را وارد کنید.";
        return;
    }

    x1 = parseFloat(x1);
    y1 = parseFloat(y1);
    x2 = parseFloat(x2);
    y2 = parseFloat(y2);

    if (isNaN(x1) || isNaN(y1) || isNaN(x2) || isNaN(y2)) {
        document.getElementById("result").innerText =
            "خطا: ورودی‌ها باید عدد باشند.";
        return;
    }

    let line = new Line(x1, y1, x2, y2);
    document.getElementById("result").innerText =
        "طول خط برابر است با: " + line.length().toFixed(2);
}
</script>

</body>
</html>
